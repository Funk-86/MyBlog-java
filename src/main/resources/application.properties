spring.application.name=MyBlog

upload.base-path=${UPLOAD_BASE_PATH:.}

myblog.storage.mode=${MYBLOG_STORAGE_MODE:local}
myblog.storage.aliyun.endpoint=${MYBLOG_ALIYUN_OSS_ENDPOINT:}
myblog.storage.aliyun.access-key-id=${MYBLOG_ALIYUN_ACCESS_KEY_ID:${ALIYUN_ACCESS_KEY_ID:}}
myblog.storage.aliyun.access-key-secret=${MYBLOG_ALIYUN_ACCESS_KEY_SECRET:${ALIYUN_ACCESS_KEY_SECRET:}}
myblog.storage.aliyun.bucket=${MYBLOG_ALIYUN_OSS_BUCKET:}
myblog.storage.aliyun.public-base-url=${MYBLOG_ALIYUN_OSS_PUBLIC_BASE_URL:}
myblog.storage.aliyun.key-prefix=${MYBLOG_ALIYUN_OSS_KEY_PREFIX:user_img/}
myblog.storage.s3.endpoint=${MYBLOG_S3_ENDPOINT:}
myblog.storage.s3.region=${MYBLOG_S3_REGION:us-east-1}
myblog.storage.s3.access-key=${MYBLOG_S3_ACCESS_KEY:}
myblog.storage.s3.secret-key=${MYBLOG_S3_SECRET_KEY:}
myblog.storage.s3.bucket=${MYBLOG_S3_BUCKET:}
myblog.storage.s3.public-base-url=${MYBLOG_S3_PUBLIC_BASE_URL:}
myblog.storage.s3.key-prefix=${MYBLOG_S3_KEY_PREFIX:user_img/}
myblog.storage.s3.path-style=${MYBLOG_S3_PATH_STYLE:false}

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:blog}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:${MYSQL_USERNAME:root}}
spring.datasource.password=${MYSQL_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl

hot.weights.view=1
hot.weights.like=5
hot.weights.comment=3
hot.weights.favorite=4
hot.weights.read50=0
hot.weights.read90=0
hot.time-decay=1.5
hot.wilson-weight=0.5
hot.wilson-z=1.96
hot.mix-alpha=0.7
hot.zset-key=zset:post:hot
hot.view-key-prefix=post:view:

video.upload.rated-size-mb=50
video.upload.transcode.max-side=720
video.upload.transcode.crf=28
video.upload.transcode.audio-bitrate-k=96
video.upload.transcode.timeout-seconds=20
video.upload.ffmpeg-bin=ffmpeg

