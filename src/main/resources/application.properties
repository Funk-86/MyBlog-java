aliyun.green.access-key-id=${ALIYUN_ACCESS_KEY_ID:}
aliyun.green.access-key-secret=${ALIYUN_ACCESS_KEY_SECRET:}
aliyun.green.region-id=${ALIYUN_GREEN_REGION_ID:cn-shenzhen}
aliyun.green.connect-timeout-ms=${ALIYUN_GREEN_CONNECT_TIMEOUT_MS:20000}
aliyun.green.read-timeout-ms=${ALIYUN_GREEN_READ_TIMEOUT_MS:25000}
aliyun.green.text-max-attempts=${ALIYUN_GREEN_TEXT_MAX_ATTEMPTS:3}
aliyun.green.image-verbose-log=${ALIYUN_GREEN_IMAGE_VERBOSE_LOG:false}

myblog.async.core-pool-size=${MYBLOG_ASYNC_CORE_POOL_SIZE:2}
myblog.async.max-pool-size=${MYBLOG_ASYNC_MAX_POOL_SIZE:4}
myblog.async.queue-capacity=${MYBLOG_ASYNC_QUEUE_CAPACITY:100}
myblog.async.keep-alive-seconds=${MYBLOG_ASYNC_KEEP_ALIVE_SECONDS:60}
myblog.ffmpeg.queue-capacity=${MYBLOG_FFMPEG_QUEUE_CAPACITY:20}