spring.application.name=MyBlog

# 上传文件根目录，Zeabur 等容器环境若工作目录只读，可设 UPLOAD_BASE_PATH=/tmp
upload.base-path=${UPLOAD_BASE_PATH:.}

# ??????????????????? 200MB???? 200MB?
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

#MySQL
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:blog}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:${MYSQL_USERNAME:root}}
spring.datasource.password=${MYSQL_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}

# MyBatis
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ??????
hot.weights.view=1
hot.weights.like=5
hot.weights.comment=3
hot.weights.favorite=4
hot.weights.read50=0
hot.weights.read90=0
hot.time-decay=1.5
# Wilson ??????????????0=????z ????????1.96?95%?
hot.wilson-weight=0.5
hot.wilson-z=1.96
# ??? + ???????? ??0=?????1=?????
hot.mix-alpha=0.7
hot.zset-key=zset:post:hot
hot.view-key-prefix=post:view:

# 视频上传：超过额定大小后自动转码降画质（需要服务器有 ffmpeg）
video.upload.rated-size-mb=50
video.upload.transcode.max-side=720
video.upload.transcode.crf=28
video.upload.transcode.audio-bitrate-k=96
video.upload.transcode.timeout-seconds=20
video.upload.ffmpeg-bin=ffmpeg

# 163
spring.mail.host=smtp.163.com
spring.mail.username=awsl0309@163.com
spring.mail.password=YVLfXquk8Gyh942R
spring.mail.port=465
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true

server.port=8080

# JSON 日期序列化与 JVM 默认时区：与库中北京时间一致
spring.jackson.time-zone=Asia/Shanghai
# Hibernate/JDBC 层也按北京时间处理时间，避免容器默认 UTC 导致偏移
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai

# 阿里云内容安全
# 香港/海外机房：优先使用华南深圳 cn-shenzhen（green-cip.cn-shenzhen.aliyuncs.com），通常比华东上海更易连通。
# 若仍超时：加大下方超时、检查安全组出站 443，或在国内再部署一台仅做审核的转发（不推荐则改用人工审核）。
aliyun.green.access-key-id=${ALIYUN_ACCESS_KEY_ID:}
aliyun.green.access-key-secret=${ALIYUN_ACCESS_KEY_SECRET:}
aliyun.green.region-id=${ALIYUN_GREEN_REGION_ID:cn-shenzhen}
# 可选：显式指定接入域名（须与 region-id 地域一致），例如 green-cip.cn-hangzhou.aliyuncs.com
# aliyun.green.endpoint=
aliyun.green.connect-timeout-ms=${ALIYUN_GREEN_CONNECT_TIMEOUT_MS:20000}
aliyun.green.read-timeout-ms=${ALIYUN_GREEN_READ_TIMEOUT_MS:25000}
aliyun.green.text-max-attempts=${ALIYUN_GREEN_TEXT_MAX_ATTEMPTS:3}
# 图片审核详细日志（建议线上关闭，避免高并发日志放大内存/IO）
aliyun.green.image-verbose-log=${ALIYUN_GREEN_IMAGE_VERBOSE_LOG:false}

# 异步线程池（有界，降低内存峰值风险）
myblog.async.core-pool-size=${MYBLOG_ASYNC_CORE_POOL_SIZE:2}
myblog.async.max-pool-size=${MYBLOG_ASYNC_MAX_POOL_SIZE:4}
myblog.async.queue-capacity=${MYBLOG_ASYNC_QUEUE_CAPACITY:100}
myblog.async.keep-alive-seconds=${MYBLOG_ASYNC_KEEP_ALIVE_SECONDS:60}
# ffmpeg 单线程队列容量（转码/抽帧任务排队）
myblog.ffmpeg.queue-capacity=${MYBLOG_FFMPEG_QUEUE_CAPACITY:20}